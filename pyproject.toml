[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotly-mirage"
version = "0.1.0"
description = "Ultra-lightweight, browser-less static image exporter for Plotly"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Benjamin Lear" }
]
keywords = ["plotly", "kaleido", "export", "svg", "png", "visualization", "headless"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "plotly>=5.0.0",
    "quickjs>=1.19.0",
    "pillow>=9.0.0",
    "resvg-py>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ProfLear/PlotlyHTMLtoSVG"

[tool.hatch.build.targets.wheel]
packages = ["src/mirage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
